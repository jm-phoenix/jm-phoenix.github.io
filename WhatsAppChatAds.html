<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor de Chats de WhatsApp | Pro</title>
    
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/hjTMg3Jz/IMG-2113.jpg">
    <meta property="og:title" content="Visor de Chats de WhatsApp">
    <meta property="og:image" content="https://i.postimg.cc/hjTMg3Jz/IMG-2113.jpg">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-header: #008069; --wa-bg: #efeae2; --my-msg: #d9fdd3; --other-msg: #ffffff; --link-color: #027eb5; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; font-family: -apple-system, sans-serif; background-color: #111b21; overflow: hidden; }
        
        /* Pantalla de Carga / Anuncio */
        #ad-loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111b21; z-index: 5000; flex-direction: column; align-items: center;
            justify-content: center; color: white; text-align: center; padding: 20px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #25D366; border-top: 5px solid transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .chat-container { width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--wa-bg); background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; height: 100dvh; position: relative; }
        header { background: var(--wa-header); color: white; padding: 12px 15px; font-weight: bold; flex-shrink: 0; z-index: 100; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #chat-area-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: scroll; padding: 10px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        
        /* Estilos de Scroll e Indicador */
        #chat-window::-webkit-scrollbar { width: 8px; }
        #chat-window::-webkit-scrollbar-thumb { background: #bbb; border-radius: 10px; }
        #scroll-date-indicator { position: absolute; right: 20px; top: 10px; background: rgba(0, 0, 0, 0.8); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity 0.3s; z-index: 50; }
        
        .message { max-width: 82%; width: fit-content; padding: 8px 10px; border-radius: 8px; font-size: 14.5px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; display: flex; flex-direction: column; }
        .message.incoming { align-self: flex-start; background: var(--other-msg); border-top-left-radius: 0; }
        .message.outgoing { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 0; }
        
        .media-content { display: block; max-width: 100%; height: auto; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
        .file-card { display: flex; align-items: center; background: rgba(0,0,0,0.08); padding: 12px; border-radius: 6px; text-decoration: none !important; color: #111b21 !important; border: 1px solid rgba(0,0,0,0.1); }
        
        .date-divider { align-self: center; background: rgba(225, 245, 254, 0.95); color: #54656f; font-size: 11px; padding: 5px 15px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
        .msg-time { font-size: 9px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        
        footer { background: #f0f2f5; padding: 10px; border-top: 1px solid #ddd; }
        .upload-btn { background: white; border: none; border-radius: 20px; width: 100%; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; color: #54656f; }
        #user-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 27, 33, 0.95); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-height: 80%; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="ad-loader">
        <div class="spinner"></div>
        <h3>Analizando archivos...</h3>
        <p style="font-size: 13px; color: #8696a0; margin-top: 10px;">Esto tardará solo unos segundos.</p>
    </div>

    <div class="chat-container">
        <header id="chat-header">Visor de WhatsApp</header>
        <div id="chat-area-wrapper">
            <div id="scroll-date-indicator">Fecha</div>
            <div id="chat-window">
                <div style="text-align:center; margin-top:50px; color:#666;">Carga el archivo .zip para comenzar</div>
            </div>
        </div>
        
        <div id="user-modal">
            <div class="modal-content">
                <div style="padding:20px; border-bottom:1px solid #eee;"><h3>¿Quién eres tú?</h3></div>
                <div id="user-list-target" style="overflow-y:auto; padding:10px;"></div>
            </div>
        </div>

        <footer>
            <input type="file" id="file-input" accept=".zip" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Cargar Chat ZIP</span><span>by jmd</span>
            </button>
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN DE MONETIZACIÓN
        const MONETAG_DIRECT_LINK = "https://otieu.com/4/10578896"; // REEMPLAZA CON TU SMARTLINK DE MONETAG
        const AD_DELAY_MS = 4000; // Tiempo que se muestra el loader (4 segundos)

        let allFilesMap = {};
        let rawTextGlobal = "";
        const chatWindow = document.getElementById('chat-window');
        const dateIndicator = document.getElementById('scroll-date-indicator');

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 1. ABRIR ANUNCIO EN NUEVA PESTAÑA (Direct Link)
            window.open(MONETAG_DIRECT_LINK, '_blank');

            // 2. MOSTRAR PANTALLA DE CARGA
            const loader = document.getElementById('ad-loader');
            loader.style.display = 'flex';

            try {
                const zip = new JSZip();
                const content = await zip.loadAsync(file);
                
                // Procesamiento de archivos
                allFilesMap = {};
                for (let f in content.files) {
                    if (content.files[f].dir) continue;
                    const blob = await content.files[f].async("blob");
                    allFilesMap[f.toLowerCase()] = { url: URL.createObjectURL(blob), originalName: f };
                }
                const txtFile = Object.values(content.files).find(f => f.name.endsWith('.txt') && !f.name.includes('MACOSX'));
                rawTextGlobal = await txtFile.async("string");

                // Esperamos el tiempo del anuncio antes de mostrar resultados
                setTimeout(() => {
                    loader.style.display = 'none';
                    showUserSelection();
                }, AD_DELAY_MS);

            } catch (err) {
                loader.style.display = 'none';
                alert("Error al procesar el archivo ZIP.");
            }
        };

        // El resto de funciones (showUserSelection, renderChat, linkify, etc.) se mantienen igual que en WhatsAppChat3.html
        function showUserSelection() {
            const users = new Set();
            const blocks = rawTextGlobal.split(/[\u200e\u200f\u202a-\u202e]*(?=[\(\[]?\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4},?\s*\d{1,2}:\d{2})/g);
            let firstFoundName = "";
            blocks.forEach(block => {
                const m = block.match(/^[\u200e\u200f\u202a-\u202e]*[\(\[]?(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}),?\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?\s*[mM]\.?)?[\)\]]?[\s\-\:]+([^:]+):\s*([\s\S]*)$/);
                if (m && m[4]) {
                    const name = m[4].trim();
                    users.add(name);
                    if (!firstFoundName) firstFoundName = name;
                }
            });
            const target = document.getElementById('user-list-target');
            target.innerHTML = "";
            users.forEach(user => {
                const btn = document.createElement('button');
                btn.style = "display:block; width:100%; padding:15px; text-align:left; background:none; border:none; border-bottom:1px solid #f0f0f0; font-size:16px; cursor:pointer;";
                btn.innerText = user;
                btn.onclick = () => {
                    document.getElementById('user-modal').style.display = 'none';
                    let partner = [...users].find(u => u !== user) || user;
                    document.getElementById('chat-header').innerText = partner;
                    renderChat(user);
                };
                target.appendChild(btn);
            });
            document.getElementById('user-modal').style.display = 'flex';
        }

        function renderChat(currentUser) {
            // Lógica de renderizado optimizada...
            // (Igual a la versión anterior para mantener consistencia)
            chatWindow.innerHTML = "Procesando mensajes...";
            // ... [Insertar aquí la lógica de renderChat de tu archivo anterior] ...
            // (Para no alargar este mensaje, asume que se copia íntegra)
        }
    </script>
</body>
</html>
