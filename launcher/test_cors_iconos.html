<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de iconos - SlugLauncher</title>
<style>
:root{--bg:#fffef7;--card:#fff;--text:#1c1c1e;--mut:#6b6b70;--bd:rgba(0,0,0,.1);--ok:#1a8f3c;--bad:#c4281c}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0c;--card:#1e1e20;--text:#f2f2f7;--mut:#9a9aa0;--bd:rgba(255,255,255,.14);--ok:#4cd470;--bad:#ff6b5e}}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mut)}
.bar{display:flex;gap:8px;margin:16px 0}
input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:16px}
button{padding:10px 16px;border-radius:10px;border:0;background:#007aff;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.ico{width:48px;height:48px;border-radius:10px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:0 0 48px;overflow:hidden;font-size:20px}
.ico img{width:100%;height:100%;object-fit:contain}
.name{font-weight:600}
.st{font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wait{color:var(--mut)}
textarea{width:100%;box-sizing:border-box;height:120px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--text);font:13px/1.4 ui-monospace,Menlo,monospace}
</style></head><body><main>
<h1>Prueba de iconos para el archivo compartido</h1>
<p>Comprueba qué servicios de favicons permiten que el launcher guarde el icono dentro del archivo (así WhatsApp lo puede mostrar). Espera unos segundos a que termine.</p>
<div class="bar"><input id="dom" value="elnuevodia.com" aria-label="Dominio"><button id="go">Probar</button></div>
<div id="rows"></div>
<p style="margin-top:18px">Resultado para copiar y pegar:</p>
<textarea id="out" readonly></textarea>
<script>
const TIMEOUT_MS = 8000;
const services = d => [
  ["Google s2 (el que usa el launcher)", `https://www.google.com/s2/favicons?sz=128&domain=${d}`],
  ["Google gstatic (alternativa)", `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent("https://"+d)}&size=128`],
  ["DuckDuckGo", `https://icons.duckduckgo.com/ip3/${d}.ico`],
  ["Directo del sitio (/favicon.ico)", `https://${d}/favicon.ico`]
];

/* Misma técnica que usa el launcher: imagen con crossOrigin + canvas. */
function testIcon(src){
  return new Promise(resolve => {
    let done = false;
    const finish = r => { if (!done) { done = true; clearTimeout(tm); resolve(r); } };
    const tm = setTimeout(() => finish({ok:false, why:"no respondió a tiempo"}), TIMEOUT_MS);
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const cv = document.createElement("canvas"); cv.width = 64; cv.height = 64;
        cv.getContext("2d").drawImage(im, 0, 0, 64, 64);
        finish({ok:true, data: cv.toDataURL("image/png")});
      } catch (e) { finish({ok:false, why:"cargó, pero el navegador bloquea leerlo (sin CORS)"}); }
    };
    im.onerror = () => finish({ok:false, why:"bloqueado o no existe (sin CORS)"});
    im.src = src;
  });
}

async function run(){
  const d = document.getElementById("dom").value.trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "");
  if (!d) return;
  const rows = document.getElementById("rows"); rows.innerHTML = "";
  const list = services(d), els = [], lines = ["Dominio probado: " + d];
  list.forEach(([name]) => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = '<div class="ico">⏳</div><div><div class="name"></div><div class="st wait">Probando…</div></div>';
    r.querySelector(".name").textContent = name; rows.appendChild(r); els.push(r);
  });
  await Promise.all(list.map(async ([name, url], i) => {
    const res = await testIcon(url), r = els[i], ico = r.querySelector(".ico"), st = r.querySelector(".st");
    if (res.ok) {
      ico.innerHTML = ""; const im = new Image(); im.src = res.data; ico.appendChild(im);
      st.className = "st ok"; st.textContent = "✅ Se puede embeber";
      lines[i + 1] = "OK       - " + name;
    } else {
      ico.textContent = "✖"; st.className = "st bad"; st.textContent = "❌ " + res.why;
      lines[i + 1] = "BLOQUEADO - " + name + " (" + res.why + ")";
    }
  }));
  document.getElementById("out").value = lines.join("\n");
}
document.getElementById("go").addEventListener("click", run);
document.getElementById("dom").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
run();
</script></main></body></html>
