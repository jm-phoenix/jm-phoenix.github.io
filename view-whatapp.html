<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Viewer Pro - Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-header: #008069; --wa-bg: #efeae2; --my-msg: #d9fdd3; --other-msg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; font-family: -apple-system, sans-serif; background-color: #111b21; overflow: hidden; }
        
        .chat-container { 
            width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--wa-bg); 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
            display: flex; flex-direction: column; height: 100dvh; position: relative;
        }

        header { background: var(--wa-header); color: white; padding: 12px 15px; font-weight: bold; flex-shrink: 0; z-index: 10; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        #user-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 27, 33, 0.95); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: white; width: 100%; max-height: 80%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .user-list { overflow-y: auto; padding: 10px; }
        .user-item { display: block; width: 100%; padding: 15px; text-align: left; background: none; border: none; border-bottom: 1px solid #f0f0f0; font-size: 16px; color: var(--wa-header); cursor: pointer; font-weight: 500; }

        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        .message { max-width: 80%; width: fit-content; padding: 8px 10px; border-radius: 8px; font-size: 14.5px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .message.incoming { align-self: flex-start; background: var(--other-msg); border-top-left-radius: 0; }
        .message.outgoing { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 0; }

        .date-divider { align-self: center; background: rgba(225, 245, 254, 0.95); color: #54656f; font-size: 11px; padding: 5px 15px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
        .msg-author { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; }
        .msg-time { font-size: 9px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        
        a.chat-link { color: #027eb5; text-decoration: underline; word-break: break-all; cursor: pointer; }
        .file-attach { display: flex; align-items: center; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; text-decoration: none; color: #111b21; margin: 5px 0; border: 1px solid rgba(0,0,0,0.1); }
        .media-content { display: block; width: 100%; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }

        footer { background: #f0f2f5; padding: 10px; border-top: 1px solid #ddd; flex-shrink: 0; }
        .upload-btn { background: white; border: none; border-radius: 20px; width: 100%; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; color: #54656f; }
        
        #theater { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; justify-content: center; align-items: center; }
        #theater img, #theater video { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>

    <div id="theater" onclick="this.style.display='none'; this.querySelector('div').innerHTML=''">
        <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <div class="chat-container">
        <div id="user-modal">
            <div class="modal-content">
                <div style="padding:20px; border-bottom:1px solid #eee;"><h3>Selecciona tu usuario</h3></div>
                <div id="user-list-target" class="user-list"></div>
            </div>
        </div>

        <header id="chat-header">Esperando chat...</header>
        <div id="chat-window"><div style="text-align:center; margin-top:50px; color:#666;">Carga el archivo .zip</div></div>

        <footer>
            <input type="file" id="file-input" accept=".zip" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Cargar Backup</span><span>📎</span>
            </button>
        </footer>
    </div>

    <script>
        let allFilesMap = {};
        let rawTextGlobal = "";

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`);
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('chat-window').innerHTML = '<div style="text-align:center; padding:20px;">Analizando...</div>';

            try {
                const zip = new JSZip();
                const content = await zip.loadAsync(file);
                allFilesMap = {};
                for (let f in content.files) {
                    if (content.files[f].dir) continue;
                    const blob = await content.files[f].async("blob");
                    allFilesMap[f] = { url: URL.createObjectURL(blob), name: f };
                }
                const txtFile = Object.values(content.files).find(f => f.name.endsWith('.txt') && !f.name.includes('MACOSX'));
                rawTextGlobal = await txtFile.async("string");
                
                // TITULO CORREGIDO: Busca el primer nombre real después de la fecha/hora
                const lines = rawTextGlobal.split('\n');
                const titleRegex = /^[\u200e\u200f]*[\(\[]?\d{1,2}\/\d{1,2}\/\d{2,4},.*?[apAP]\.?\s*[mM]\.?[\)\]]?\s*(.*?):\s*/;
                for(let line of lines) {
                    const match = line.match(titleRegex);
                    if(match && match[1]) {
                        // En tu caso detectará "Wilden U 2025"
                        document.getElementById('chat-header').innerText = "Chat de " + match[1].trim();
                        break;
                    }
                }

                showUserSelection();
            } catch (err) { alert(err.message); }
        });

        function showUserSelection() {
            const regex = /^[\u200e\u200f]*[\(\[]?.*?,.*?[apAP]\.?\s*[mM]\.?[\)\]]?\s*(.*?):\s*/;
            const lines = rawTextGlobal.split('\n');
            const users = new Set();
            lines.forEach(line => {
                const m = line.match(regex);
                if (m) users.add(m[1].trim());
            });

            const listTarget = document.getElementById('user-list-target');
            listTarget.innerHTML = "";
            users.forEach(user => {
                const btn = document.createElement('button');
                btn.className = 'user-item';
                btn.innerText = user;
                btn.onclick = () => {
                    document.getElementById('user-modal').style.display = 'none';
                    renderChat(user);
                };
                listTarget.appendChild(btn);
            });
            document.getElementById('user-modal').style.display = 'flex';
        }

        function renderChat(currentUser) {
            const container = document.getElementById('chat-window');
            container.innerHTML = "";
            const lines = rawTextGlobal.split('\n');
            const regex = /^[\u200e\u200f]*[\(\[]?(\d{1,2}\/\d{1,2}\/\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?\s*[mM]\.?)[\)\]]?\s*(.*?):\s*(.*)$/;

            let html = "";
            let lastDate = "";

            lines.forEach(line => {
                const m = line.trim().match(regex);
                if (m) {
                    const [full, date, timeStr, ampm, author, bodyRaw] = m;
                    const cleanAuthor = author.trim();
                    let body = bodyRaw;
                    const time = `${timeStr} ${ampm.replace(/\./g, "").toUpperCase()}`;

                    if (date !== lastDate) {
                        html += `<div class="date-divider">${date}</div>`;
                        lastDate = date;
                    }

                    const isMe = (cleanAuthor === currentUser);
                    let mediaHTML = "";
                    
                    for (let fName in allFilesMap) {
                        if (body.toLowerCase().includes(fName.toLowerCase())) {
                            const fileObj = allFilesMap[fName];
                            if (fName.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                                mediaHTML = `<img class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',false)">`;
                            } else if (fName.match(/\.(mp4|mov)$/i)) {
                                mediaHTML = `<video class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',true)"></video>`;
                            } else {
                                let icon = fName.endsWith('.pdf') ? "📕" : (fName.endsWith('.opus') ? "🎤" : "📄");
                                mediaHTML = `<a href="${fileObj.url}" download="${fName}" class="file-attach"><span>${icon}</span> <span style="font-size:11px; margin-left:8px;">${fName}</span></a>`;
                            }
                            body = body.replace(new RegExp(fName, 'gi'), "").replace("<adjunto: >", "").trim();
                            break;
                        }
                    }

                    html += `
                        <div class="message ${isMe ? 'outgoing' : 'incoming'}">
                            ${!isMe ? `<span class="msg-author" style="color:${getColor(cleanAuthor)}">${cleanAuthor}</span>` : ''}
                            ${mediaHTML}
                            <span class="body-text">${linkify(body)}</span>
                            <span class="msg-time">${time}</span>
                        </div>`;
                }
            });

            container.innerHTML = html;
            container.scrollTop = 0;
        }

        function openTheater(url, isVid) {
            const t = document.getElementById('theater');
            t.querySelector('div').innerHTML = isVid ? `<video src="${url}" controls autoplay style="max-width:100%; max-height:100%"></video>` : `<img src="${url}" style="max-width:100%; max-height:100%">`;
            t.style.display = 'flex';
        }

        function getColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 35%)`;
        }
    </script>
</body>
</html>
