<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor WhatsApp Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --whatsapp-green: #008069;
            --chat-bg: #efeae2;
            --bubble-sent: #dcf8c6;
            --bubble-received: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111b21;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--chat-bg);
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--whatsapp-green);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message {
            max-width: 85%;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            background-color: var(--bubble-received);
            align-self: flex-start;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            word-wrap: break-word;
            margin-bottom: 2px;
        }

        .media-content {
            width: 100%;
            max-width: 100%;
            border-radius: 6px;
            margin-bottom: 5px;
            display: block;
        }

        .msg-author {
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }
        
        .msg-time {
            font-size: 10px;
            color: #667781;
            float: right;
            margin-top: 4px;
            margin-left: 10px;
        }

        footer {
            background-color: #f0f2f5;
            padding: 10px 15px;
        }

        .upload-btn {
            background-color: white;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 10px 15px;
            color: #54656f;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <div style="width: 38px; height: 38px; background: #abb4ba; border-radius: 50%; margin-right: 12px;"></div>
            <div>
                <strong id="chat-title">Visor Privado</strong><br>
                <small id="chat-subtitle" style="font-size: 11px; opacity: 0.9;">Local Mode</small>
            </div>
        </header>

        <div id="chat-window">
            <div style="text-align: center; margin-top: 40%; color: #667781; font-size: 13px; padding: 20px;">
                Carga el archivo .zip exportado de tu chat.<br>
                <strong>Formato detectado:</strong> ([M/D/A, h:m:s])
            </div>
        </div>

        <footer>
            <input type="file" id="file-input" accept=".zip">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Cargar nuevo backup...</span>
                <span>📎</span>
            </button>
        </footer>
    </div>

    <script>
        document.getElementById('file-input').addEventListener('change', handleFileSelect, false);

        let mediaMap = {};

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '<div style="text-align:center; padding:20px;">Leyendo ZIP...</div>';
            
            try {
                // Limpiar URLs anteriores para liberar memoria
                Object.values(mediaMap).forEach(url => URL.revokeObjectURL(url));
                mediaMap = {};

                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                // Procesar archivos multimedia
                const mediaPromises = [];
                zip.forEach((path, entry) => {
                    if (path.match(/\.(jpg|jpeg|png|gif|mp4|mov|webp)$/i)) {
                        mediaPromises.push(entry.async("blob").then(blob => {
                            mediaMap[path] = URL.createObjectURL(blob);
                        }));
                    }
                });
                await Promise.all(mediaPromises);

                // Buscar el txt
                let txtFile = contents.file("_chat.txt") || Object.values(contents.files).find(f => f.name.endsWith('.txt'));
                if (!txtFile) throw new Error("No se encontró el archivo de texto.");

                const rawText = await txtFile.async("string");
                renderChat(rawText);
                
                document.getElementById('chat-subtitle').innerText = "Viendo historial local";

            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        function renderChat(text) {
            const window = document.getElementById('chat-window');
            window.innerHTML = '';
            
            const lines = text.split('\n');
            
            // REGEX PARA: ([M/D/A, h:m:s p.m.])
            // Explicación: 
            // \( -> Paréntesis inicial
            // \[ -> Corchete inicial
            // (\d{1,2}\/\d{1,2}\/\d{2,4}) -> Grupo 1: Fecha
            // ,\s+ -> Coma y espacio
            // (\d{1,2}:\d{2}:\d{2}) -> Grupo 2: Hora:Min:Seg
            // \s?([ap]\.?m\.?) -> Grupo 3: am/pm
            // \] -> Corchete final
            // \) -> Paréntesis final
            const regex = /^\(\[(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2}:\d{2})\s?([ap]\.?m\.?)\]\)\s(.*?): (.*)$/i;

            lines.forEach(line => {
                const cleanLine = line.replace(/[\u200e\u200f]/g, "");
                const match = cleanLine.match(regex);

                if (match) {
                    const time = `${match[2].substring(0,5)} ${match[3].replace(/\./g,'')}`;
                    const author = match[4];
                    let content = match[5];

                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message';

                    // Buscar adjunto en el mensaje
                    let mediaTag = "";
                    for (let fileName in mediaMap) {
                        if (content.includes(fileName)) {
                            if (fileName.match(/\.(mp4|mov)$/i)) {
                                mediaTag = `<video class="media-content" controls src="${mediaMap[fileName]}"></video>`;
                            } else {
                                mediaTag = `<img class="media-content" src="${mediaMap[fileName]}" onclick="window.open(this.src)">`;
                            }
                            content = content.replace(fileName, "").replace("<adjunto: >", "").replace("(archivo adjunto)", "").trim();
                            break;
                        }
                    }

                    msgDiv.innerHTML = `
                        <span class="msg-author" style="color:${getHashColor(author)}">${author}</span>
                        ${mediaTag}
                        <span>${content || ""}</span>
                        <span class="msg-time">${time}</span>
                    `;
                    window.appendChild(msgDiv);
                } else {
                    // Continuación de mensaje anterior
                    if (window.lastChild && window.lastChild.className === 'message') {
                        const lastSpan = window.lastChild.querySelector('span:nth-child(2)');
                        if (lastSpan) lastSpan.innerHTML += "<br>" + cleanLine;
                    }
                }
            });
            window.scrollTop = window.scrollHeight;
        }

        function getHashColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 60%, 35%)`;
        }
    </script>
</body>
</html>
