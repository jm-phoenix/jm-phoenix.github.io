<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Viewer Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-bg: #efeae2; --wa-header: #008069; --wa-bubble: #ffffff; --wa-footer: #f0f2f5; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #111b21; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background-color: var(--wa-bg); background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--wa-header); color: white; padding: 12px; z-index: 10; font-weight: bold; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        .message { max-width: 85%; padding: 8px; border-radius: 8px; font-size: 14px; background: white; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .msg-author { font-size: 12px; font-weight: bold; color: #d85d28; display: block; margin-bottom: 2px; }
        .msg-time { font-size: 10px; color: #888; float: right; margin-top: 4px; margin-left: 8px; }
        .media-content { width: 100%; border-radius: 5px; margin: 4px 0; display: block; }
        footer { background: var(--wa-footer); padding: 10px; border-top: 1px solid #ccc; }
        .upload-btn { background: white; border: none; border-radius: 20px; width: 100%; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        #progress-container { width: 100%; background: #eee; height: 5px; margin-top: 10px; display: none; }
        #progress-bar { width: 0%; height: 100%; background: var(--wa-header); }
        .debug-box { background: #fee; border: 1px solid red; padding: 10px; font-size: 11px; margin-top: 10px; color: #333; overflow-x: auto; white-space: pre; }
    </style>
</head>
<body>
    <div class="chat-container">
        <header id="header-text">WhatsApp Viewer</header>
        <div id="chat-window">
            <div id="welcome" style="text-align:center; padding-top:50px; color: #666;">
                <p>Sube tu archivo .zip aquí abajo</p>
            </div>
        </div>
        <footer>
            <input type="file" id="file-input" accept=".zip" style="display:none">
            <div id="progress-container"><div id="progress-bar"></div></div>
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Seleccionar Backup (.zip)</span><span>📎</span>
            </button>
        </footer>
    </div>

    <script>
        let mediaMap = {};
        const fileInput = document.getElementById('file-input');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('chat-window').innerHTML = '<div style="text-align:center; padding:20px;">Procesando ZIP...</div>';
            document.getElementById('progress-container').style.display = 'block';

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);
                
                // 1. Cargar Medios
                const files = Object.keys(zipContent.files);
                for (let i = 0; i < files.length; i++) {
                    const name = files[i];
                    if (name.match(/\.(jpg|jpeg|png|gif|mp4|mov|webp)$/i)) {
                        const blob = await zipContent.files[name].async("blob");
                        mediaMap[name] = URL.createObjectURL(blob);
                    }
                    document.getElementById('progress-bar').style.width = ((i/files.length)*50) + "%";
                }

                // 2. Buscar TXT (cualquiera que sea el más grande o el chat principal)
                const txtFile = Object.values(zipContent.files).find(f => f.name.endsWith('.txt') && !f.name.includes('MACOSX'));
                if (!txtFile) throw new Error("No se encontró archivo .txt");

                const rawText = await txtFile.async("string");
                processChat(rawText);

            } catch (err) {
                document.getElementById('chat-window').innerHTML = `<div class="debug-box">Error crítico: ${err.message}</div>`;
            }
        });

        function processChat(text) {
            const window = document.getElementById('chat-window');
            window.innerHTML = '';
            const lines = text.split('\n');
            
            // REGEX MEJORADO: Detecta ([M/D/A, H:M:S AM/PM]) con flexibilidad total en espacios y puntos
            const regex = /^\(\[(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?\s*[mM]\.?)\]\)\s*(.*?):\s*(.*)$/;

            let html = "";
            let count = 0;

            lines.forEach(line => {
                const cleanLine = line.replace(/[\u200e\u200f]/g, "").trim();
                if (!cleanLine) return;

                const m = cleanLine.match(regex);
                if (m) {
                    count++;
                    const author = m[4];
                    let content = m[5];
                    const time = m[2] + " " + m[3].replace(/\./g, "").toUpperCase();

                    let media = "";
                    for (let f in mediaMap) {
                        if (content.includes(f)) {
                            if (f.match(/\.(mp4|mov)$/i)) media = `<video controls class="media-content" src="${mediaMap[f]}"></video>`;
                            else media = `<img class="media-content" src="${mediaMap[f]}" onclick="window.open(this.src)">`;
                            content = content.replace(f, "").replace("<adjunto: >", "").replace("(archivo adjunto)", "");
                            break;
                        }
                    }

                    html += `<div class="message">
                        <span class="msg-author">${author}</span>
                        ${media}
                        <span>${content}</span>
                        <div class="msg-time">${time}</div>
                    </div>`;
                }
            });

            if (count === 0) {
                window.innerHTML = `<div class="debug-box"><b>No se detectaron mensajes.</b><br>Analizando formato...<br><br>Primera línea detectada:<br>${lines[0]}<br><br>Si el formato anterior no coincide con: ([M/D/A, h:m:s p.m.]), el script no podrá leerlo.</div>`;
            } else {
                window.innerHTML = html;
                window.scrollTop = window.scrollHeight;
                document.getElementById('progress-container').style.display = 'none';
            }
        }
    </script>
</body>
</html>
