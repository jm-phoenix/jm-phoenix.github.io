<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor de WhatsApp Pro | Corregido iOS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-header: #008069; --wa-bg: #efeae2; --my-msg: #d9fdd3; --other-msg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #111b21; overflow: hidden; height: 100dvh; }
        
        .chat-container { width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--wa-bg); background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; height: 100%; position: relative; }
        header { background: var(--wa-header); color: white; padding: 12px 15px; font-weight: bold; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        #chat-area-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: scroll; padding: 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }

        /* Scrollbar iOS Grueso */
        #chat-window::-webkit-scrollbar { width: 14px; }
        #chat-window::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }

        #scroll-date { position: absolute; right: 20px; top: 10px; background: rgba(0,0,0,0.8); color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; opacity: 0; transition: opacity 0.3s; z-index: 50; }

        .message { max-width: 85%; padding: 8px 10px; border-radius: 8px; font-size: 14.5px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); white-space: pre-wrap; word-wrap: break-word; position: relative; }
        .incoming { align-self: flex-start; background: var(--other-msg); border-top-left-radius: 0; }
        .outgoing { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 0; }

        .msg-author { font-size: 12px; font-weight: bold; color: #128c7e; display: block; margin-bottom: 2px; }
        .msg-time { font-size: 10px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        .date-divider { align-self: center; background: rgba(225, 245, 254, 0.9); padding: 4px 12px; border-radius: 7px; margin: 10px 0; font-size: 11px; color: #54656f; font-weight: 600; }

        footer { background: #f0f2f5; padding: 10px; border-top: 1px solid #ddd; }
        .upload-btn { background: white; border-radius: 20px; width: 100%; padding: 12px; border: none; color: #54656f; cursor: pointer; display: flex; justify-content: space-between; }
        .media-box img, .media-box video { max-width: 100%; border-radius: 5px; margin-bottom: 5px; cursor: pointer; }
        #theater { display: none; position: fixed; inset: 0; background: black; z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="theater" onclick="this.style.display='none'; this.innerHTML=''"></div>

<div class="chat-container">
    <header id="chat-header">Visor de Chats</header>
    <div id="chat-area-wrapper">
        <div id="scroll-date"></div>
        <div id="chat-window">
            <div style="text-align:center; padding-top:40px; color:#888;">Carga el ZIP de tu chat</div>
        </div>
    </div>
    <footer>
        <input type="file" id="file-input" accept=".zip" style="display:none">
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">
            <span>Adjuntar archivo ZIP</span><span>📎</span>
        </button>
    </footer>
</div>

<script>
let files = {};
let scrollT;

const chatWin = document.getElementById('chat-window');
const dateDiv = document.getElementById('scroll-date');

chatWin.onscroll = () => {
    dateDiv.style.opacity = "1";
    clearTimeout(scrollT);
    const dividers = document.querySelectorAll('.date-divider');
    dividers.forEach(d => { if(d.getBoundingClientRect().top < 200) dateDiv.innerText = d.innerText; });
    
    // Mover el indicador con el scroll
    const pct = chatWin.scrollTop / (chatWin.scrollHeight - chatWin.clientHeight);
    dateDiv.style.top = (pct * (chatWin.clientHeight - 40)) + 10 + "px";
    
    scrollT = setTimeout(() => dateDiv.style.opacity = "0", 1000);
};

document.getElementById('file-input').onchange = async (e) => {
    const zip = new JSZip();
    const content = await zip.loadAsync(e.target.files[0]);
    files = {};
    for (let f in content.files) {
        if (!content.files[f].dir) {
            const blob = await content.files[f].async("blob");
            files[f] = URL.createObjectURL(blob);
        }
    }
    const txtName = Object.keys(content.files).find(n => n.endsWith('.txt') && !n.includes('MACOSX'));
    const text = await content.files[txtName].async("string");
    processChat(text);
};

function processChat(text) {
    // REGEX ACTUALIZADO PARA SOPORTAR [FECHA, HORA] Y ~ USUARIO
    const lines = text.split('\n');
    const msgRegex = /^[\u200e\u200f]*[\[\(](\d{1,2}\/\d{1,2}\/\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?\s*.*?[apAP]\.?\s*[mM]\.?)[\]\)]\s*(.*?):\s*(.*)$/;
    
    let parsed = [];
    let current = null;

    lines.forEach(line => {
        const m = line.match(msgRegex);
        if (m) {
            current = { date: m[1], time: m[2], user: m[3].trim(), body: m[4], media: "" };
            parsed.push(current);
        } else if (current) {
            current.body += "\n" + line;
        }
    });

    render(parsed);
}

function render(msgs) {
    let html = "";
    let lastD = "";
    const myUser = msgs[0]?.user; // El primer usuario se asume como "otro" para preguntar después o marcar tendencia

    msgs.forEach(m => {
        if (m.date !== lastD) {
            html += `<div class="date-divider">${m.date}</div>`;
            lastD = m.date;
        }

        let body = m.body;
        let media = "";
        
        // Buscar archivos en el cuerpo del mensaje
        for(let f in files) {
            if(body.includes(f)) {
                if(f.match(/\.(jpg|jpeg|png|gif|webp)$/i)) media = `<div class="media-box"><img src="${files[f]}" onclick="zoom('${files[f]}')"></div>`;
                else if(f.match(/\.(mp4|mov)$/i)) media = `<div class="media-box"><video src="${files[f]}" controls></video></div>`;
                body = body.replace(f, "").replace("<adjunto: >", "").replace("documento omitido", "").trim();
            }
        }

        const isMe = m.user === "~ Miguel"; // Ajusta esto según el usuario que quieras a la derecha
        html += `
            <div class="message ${isMe ? 'outgoing' : 'incoming'}">
                <span class="msg-author">${m.user}</span>
                ${media}
                <span>${body}</span>
                <span class="msg-time">${m.time}</span>
            </div>`;
    });
    chatWin.innerHTML = html;
}

function zoom(url) {
    const t = document.getElementById('theater');
    t.innerHTML = `<img src="${url}" style="max-width:95%; max-height:95%">`;
    t.style.display = "flex";
}
</script>
</body>
</html>
