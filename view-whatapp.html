<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Viewer Pro v4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-header: #008069; --wa-bg: #efeae2; --date-bg: rgba(225, 245, 254, 0.95); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; font-family: -apple-system, sans-serif; background-color: #111b21; overflow: hidden; }
        
        .chat-container { 
            width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--wa-bg); 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
            display: flex; flex-direction: column; height: 100dvh;
        }

        header { background: var(--wa-header); color: white; padding: 12px 15px; font-weight: bold; flex-shrink: 0; z-index: 20; }
        #chat-window { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        .date-divider {
            align-self: center; background: var(--date-bg); color: #54656f;
            font-size: 11px; padding: 5px 15px; border-radius: 8px;
            margin: 15px 0; text-transform: uppercase; font-weight: 600;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        .message { 
            max-width: 80%; width: fit-content; padding: 8px 10px; border-radius: 8px; 
            font-size: 14px; background: white; align-self: flex-start; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; color: #111b21;
        }

        .msg-author { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; color: #d85d28; }
        .msg-time { font-size: 9px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        .media-content { display: block; width: 100%; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }

        /* Botón de archivo mejorado */
        .file-attach {
            display: flex; align-items: center; background: #e9edef; 
            padding: 12px; border-radius: 8px; text-decoration: none; 
            color: #111b21; margin: 8px 0; border: 1px solid #d1d7db;
            transition: background 0.2s;
        }
        .file-attach:active { background: #d1d7db; }
        .file-icon { font-size: 24px; margin-right: 12px; flex-shrink: 0; }
        .file-info { display: flex; flex-direction: column; overflow: hidden; }
        .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-action { font-size: 11px; color: #008069; font-weight: bold; }

        #theater {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; z-index: 1000; justify-content: center; align-items: center;
        }
        #theater img, #theater video { max-width: 100%; max-height: 100%; }

        footer { background: #f0f2f5; padding: 10px; border-top: 1px solid #ddd; flex-shrink: 0; }
        .upload-btn { background: white; border: none; border-radius: 20px; width: 100%; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; color: #54656f; }
        a.chat-link { color: #007bff; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="theater" onclick="this.style.display='none'; this.querySelector('div').innerHTML=''">
        <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <div class="chat-container">
        <header id="chat-header">WhatsApp Viewer Pro</header>
        <div id="chat-window">
            <div style="text-align:center; margin-top:50px; color:#666;">Selecciona el archivo .zip de tu exportación</div>
        </div>
        <footer>
            <input type="file" id="file-input" accept=".zip" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Cargar Chat ZIP</span><span>📎</span>
            </button>
        </footer>
    </div>

    <script>
        let allFilesMap = {};

        function openTheater(url, isVid) {
            const t = document.getElementById('theater');
            t.querySelector('div').innerHTML = isVid ? `<video src="${url}" controls autoplay></video>` : `<img src="${url}">`;
            t.style.display = 'flex';
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, (url) => {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
            });
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const win = document.getElementById('chat-window');
            win.innerHTML = '<div style="text-align:center; padding:20px;">Abriendo archivo...</div>';

            try {
                const zip = new JSZip();
                const content = await zip.loadAsync(file);
                allFilesMap = {};

                // Extraer todos los archivos
                const files = Object.keys(content.files);
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    if (content.files[f].dir) continue;
                    const blob = await content.files[f].async("blob");
                    allFilesMap[f] = {
                        url: URL.createObjectURL(blob),
                        name: f
                    };
                }

                const txtFile = Object.values(content.files).find(f => f.name.endsWith('.txt') && !f.name.includes('MACOSX'));
                const rawText = await txtFile.async("string");
                renderChat(rawText);
            } catch (err) {
                win.innerHTML = `<div style="color:red; padding:20px;">Error: ${err.message}</div>`;
            }
        });

        function renderChat(text) {
            const container = document.getElementById('chat-window');
            container.innerHTML = "";
            const lines = text.split('\n');
            const regex = /^[\u200e\u200f]*[\(\[]?(\d{1,2}\/\d{1,2}\/\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?\s*[mM]\.?)[\)\]]?\s*(.*?):\s*(.*)$/;

            let html = "";
            let lastDate = "";
            let messageCount = 0;

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine) return;
                const m = cleanLine.match(regex);

                if (m) {
                    const currentDate = m[1];
                    const time = `${m[2]} ${m[3].replace(/\./g, "").toUpperCase()}`;
                    const author = m[4];
                    let body = m[5];

                    if (currentDate !== lastDate) {
                        html += `<div class="date-divider">${currentDate}</div>`;
                        lastDate = currentDate;
                    }

                    messageCount++;
                    let attachmentsHTML = "";
                    
                    // Lógica de detección difusa de archivos
                    for (let fName in allFilesMap) {
                        // Si el cuerpo del mensaje contiene el nombre del archivo del ZIP
                        if (body.toLowerCase().includes(fName.toLowerCase())) {
                            const fileObj = allFilesMap[fName];
                            
                            if (fName.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                                attachmentsHTML += `<img class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',false)">`;
                            } else if (fName.match(/\.(mp4|mov)$/i)) {
                                attachmentsHTML += `<video class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',true)"></video>`;
                            } else {
                                let icon = "📄";
                                if (fName.endsWith('.pdf')) icon = "📕";
                                if (fName.endsWith('.opus')) icon = "🎤";
                                if (fName.endsWith('.vcf')) icon = "👤";
                                
                                attachmentsHTML += `
                                    <a href="${fileObj.url}" download="${fName}" class="file-attach" onclick="return confirm('¿Descargar este archivo?')">
                                        <span class="file-icon">${icon}</span>
                                        <div class="file-info">
                                            <span class="file-name">${fName}</span>
                                            <span class="file-action">Toca para descargar</span>
                                        </div>
                                    </a>`;
                            }
                            // Limpiamos el nombre del archivo del texto para que no se vea doble
                            body = body.replace(new RegExp(fName, 'gi'), "").replace("<adjunto: >", "").replace("(archivo adjunto)", "").trim();
                        }
                    }

                    html += `
                        <div class="message">
                            <span class="msg-author" style="color:${getColor(author)}">${author}</span>
                            ${attachmentsHTML}
                            <span>${linkify(body)}</span>
                            <span class="msg-time">${time}</span>
                        </div>`;
                } else if (messageCount > 0) {
                    html = html.replace(/(<\/span>)\s*(<span class="msg-time">)/, `$1<br>${linkify(cleanLine)}$2`);
                }
            });

            container.innerHTML = html || '<div style="padding:20px;">No se encontraron mensajes legibles.</div>';
            container.scrollTop = container.scrollHeight;
            document.getElementById('chat-header').innerText = "Historial Completo";
        }

        function getColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 60%, 35%)`;
        }
    </script>
</body>
</html>
