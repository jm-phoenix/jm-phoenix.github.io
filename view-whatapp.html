<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Visor de Chats de WhatsApp | Pro</title>
    
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" fill="none"/><path d="M256 96C176 96 112 154 112 230c0 36 14 68 36 92l-12 64 64-12c22 12 44 18 68 18 80 0 144-58 144-134S336 96 256 96z" fill="%2325D366"/><text x="256" y="270" text-anchor="middle" font-size="96" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="%23FFFFFF">zip</text></svg>'>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --wa-header: #008069; --wa-bg: #efeae2; --my-msg: #d9fdd3; --other-msg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; font-family: -apple-system, sans-serif; background-color: #111b21; overflow: hidden; }
        
        .chat-container { 
            width: 100%; max-width: 500px; margin: 0 auto; background-color: var(--wa-bg); 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); 
            display: flex; flex-direction: column; height: 100dvh; position: relative;
        }

        header { 
            background: var(--wa-header); color: white; padding: 12px 15px; 
            font-weight: bold; flex-shrink: 0; z-index: 100; font-size: 16px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }

        /* Contenedor relativo para limitar el indicador al área del chat */
        #chat-area-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de Scroll Gruesa y Gris Oscuro */
        #chat-window { 
            flex: 1; overflow-y: scroll; overflow-x: hidden; padding: 10px; display: flex; flex-direction: column; gap: 8px; 
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch;
        }

        #chat-window::-webkit-scrollbar { width: 14px !important; display: block !important; }
        #chat-window::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        #chat-window::-webkit-scrollbar-thumb { 
            background-color: #555 !important; border-radius: 10px; 
            border: 2px solid rgba(255,255,255,0.1); background-clip: content-box; 
        }

        /* Indicador de Fecha - Ahora dentro del wrapper */
        #scroll-date-indicator {
            position: absolute; 
            right: 20px; 
            top: 0; 
            background: rgba(0, 0, 0, 0.85); color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 50;
            white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        #user-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 27, 33, 0.95); z-index: 200;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content { background: white; width: 100%; max-height: 80%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .user-list { overflow-y: auto; padding: 10px; }
        .user-item { display: block; width: 100%; padding: 15px; text-align: left; background: none; border: none; border-bottom: 1px solid #f0f0f0; font-size: 16px; color: var(--wa-header); cursor: pointer; font-weight: 500; }

        .message { 
            max-width: 82%; width: fit-content; padding: 8px 10px; border-radius: 8px; 
            font-size: 14.5px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .message.incoming { align-self: flex-start; background: var(--other-msg); border-top-left-radius: 0; }
        .message.outgoing { align-self: flex-end; background: var(--my-msg); border-top-right-radius: 0; }

        .date-divider { align-self: center; background: rgba(225, 245, 254, 0.95); color: #54656f; font-size: 11px; padding: 5px 15px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
        .msg-author { font-size: 11px; font-weight: bold; display: block; margin-bottom: 3px; }
        .msg-time { font-size: 9px; color: #667781; display: block; text-align: right; margin-top: 4px; }
        
        footer { background: #f0f2f5; padding: 10px; border-top: 1px solid #ddd; flex-shrink: 0; }
        .upload-btn { background: white; border: none; border-radius: 20px; width: 100%; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; color: #54656f; }
        #theater { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; justify-content: center; align-items: center; }
        .media-content { display: block; width: 100%; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="theater" onclick="this.style.display='none'; this.querySelector('div').innerHTML=''">
        <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <div class="chat-container">
        <header id="chat-header">Visor de WhatsApp</header>

        <div id="chat-area-wrapper">
            <div id="scroll-date-indicator">Fecha</div>

            <div id="chat-window">
                <div style="text-align:center; margin-top:50px; color:#666;">Carga el archivo .zip para comenzar</div>
            </div>
        </div>

        <div id="user-modal">
            <div class="modal-content">
                <div style="padding:20px; border-bottom:1px solid #eee;"><h3>Selecciona tu usuario</h3></div>
                <div id="user-list-target" class="user-list"></div>
            </div>
        </div>

        <footer>
            <input type="file" id="file-input" accept=".zip" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                <span>Cargar Chat ZIP</span><span>📎</span>
            </button>
        </footer>
    </div>

    <script>
        let allFilesMap = {};
        let rawTextGlobal = "";
        let scrollTimeout;

        const chatWindow = document.getElementById('chat-window');
        const dateIndicator = document.getElementById('scroll-date-indicator');

        chatWindow.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            dateIndicator.style.opacity = '1';

            // CÁLCULO DE POSICIÓN CORREGIDO
            const scrollTotal = chatWindow.scrollHeight - chatWindow.clientHeight;
            if (scrollTotal > 0) {
                const scrollCurrent = chatWindow.scrollTop;
                const scrollPercent = scrollCurrent / scrollTotal;
                
                // Calculamos basándonos en la altura del chatWindow, no de la pantalla completa
                const indicatorHeight = dateIndicator.offsetHeight;
                const windowHeight = chatWindow.clientHeight;
                
                // Mantenemos un margen de 10px arriba y abajo dentro del área de chat
                const topPos = (scrollPercent * (windowHeight - indicatorHeight - 20)) + 10;
                
                dateIndicator.style.top = `${topPos}px`;
            }

            // Detección de Fecha
            const dividers = chatWindow.querySelectorAll('.date-divider');
            let currentDate = "";
            dividers.forEach(div => {
                const rect = div.getBoundingClientRect();
                // Ajustado para detectar la fecha cerca del tope del chatWindow
                if (rect.top < (chatWindow.offsetTop + 150)) {
                    currentDate = div.innerText;
                }
            });

            if(currentDate) dateIndicator.innerText = currentDate;

            scrollTimeout = setTimeout(() => {
                dateIndicator.style.opacity = '0';
            }, 1000);
        });

        // Funciones de carga y renderizado (sin cambios)
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            chatWindow.innerHTML = '<div style="text-align:center; padding:20px;">Abriendo ZIP...</div>';

            try {
                const zip = new JSZip();
                const content = await zip.loadAsync(file);
                allFilesMap = {};
                for (let f in content.files) {
                    if (content.files[f].dir) continue;
                    const blob = await content.files[f].async("blob");
                    allFilesMap[f] = { url: URL.createObjectURL(blob), name: f };
                }
                const txtFile = Object.values(content.files).find(f => f.name.endsWith('.txt') && !f.name.includes('MACOSX'));
                rawTextGlobal = await txtFile.async("string");
                
                const lines = rawTextGlobal.split('\n');
                const titleRegex = /^[\u200e\u200f]*[\(\[]?\d{1,2}\/\d{1,2}\/\d{2,4},.*?[apAP]\.?\s*[mM]\.?[\)\]]?\s*(.*?):\s*/;
                for(let line of lines) {
                    const match = line.match(titleRegex);
                    if(match && match[1]) {
                        document.getElementById('chat-header').innerText = "Chat de " + match[1].trim();
                        break;
                    }
                }
                showUserSelection();
            } catch (err) { alert("Error: " + err.message); }
        });

        function showUserSelection() {
            const regex = /^[\u200e\u200f]*[\(\[]?.*?,.*?[apAP]\.?\s*[mM]\.?[\)\]]?\s*(.*?):\s*/;
            const users = new Set();
            rawTextGlobal.split('\n').forEach(line => {
                const m = line.match(regex);
                if (m) users.add(m[1].trim());
            });
            const listTarget = document.getElementById('user-list-target');
            listTarget.innerHTML = "";
            users.forEach(user => {
                const btn = document.createElement('button');
                btn.className = 'user-item';
                btn.innerText = user;
                btn.onclick = () => {
                    document.getElementById('user-modal').style.display = 'none';
                    renderChat(user);
                };
                listTarget.appendChild(btn);
            });
            document.getElementById('user-modal').style.display = 'flex';
        }

        function renderChat(currentUser) {
            chatWindow.innerHTML = "";
            const lines = rawTextGlobal.split('\n');
            const regex = /^[\u200e\u200f]*[\(\[]?(\d{1,2}\/\d{1,2}\/\d{2,4}),\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*([apAP]\.?\s*[mM]\.?)[\)\]]?\s*(.*?):\s*(.*)$/;
            let html = "";
            let lastDate = "";

            lines.forEach(line => {
                const m = line.trim().match(regex);
                if (m) {
                    const [full, date, timeStr, ampm, author, bodyRaw] = m;
                    const cleanAuthor = author.trim();
                    let body = bodyRaw;
                    const time = `${timeStr} ${ampm.replace(/\./g, "").toUpperCase()}`;
                    if (date !== lastDate) {
                        html += `<div class="date-divider">${date}</div>`;
                        lastDate = date;
                    }
                    const isMe = (cleanAuthor === currentUser);
                    let mediaHTML = "";
                    for (let fName in allFilesMap) {
                        if (body.toLowerCase().includes(fName.toLowerCase())) {
                            const fileObj = allFilesMap[fName];
                            if (fName.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                                mediaHTML = `<img class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',false)">`;
                            } else if (fName.match(/\.(mp4|mov)$/i)) {
                                mediaHTML = `<video class="media-content" src="${fileObj.url}" onclick="openTheater('${fileObj.url}',true)"></video>`;
                            } else {
                                let icon = fName.endsWith('.pdf') ? "📕" : (fName.endsWith('.opus') ? "🎤" : "📄");
                                mediaHTML = `<a href="${fileObj.url}" download="${fName}" style="text-decoration:none; color:inherit;"><div class="file-attach"><span>${icon}</span> <span style="font-size:11px; margin-left:8px;">${fName}</span></div></a>`;
                            }
                            body = body.replace(new RegExp(fName, 'gi'), "").replace("<adjunto: >", "").trim();
                            break;
                        }
                    }
                    html += `<div class="message ${isMe ? 'outgoing' : 'incoming'}">${!isMe ? `<span class="msg-author" style="color:${getColor(cleanAuthor)}">${cleanAuthor}</span>` : ''}${mediaHTML}<span>${body}</span><span class="msg-time">${time}</span></div>`;
                }
            });
            chatWindow.innerHTML = html;
            chatWindow.scrollTop = 0;
        }

        function getColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 35%)`;
        }

        function openTheater(url, isVid) {
            const t = document.getElementById('theater');
            t.querySelector('div').innerHTML = isVid ? `<video src="${url}" controls autoplay style="max-width:100%; max-height:100%"></video>` : `<img src="${url}" style="max-width:100%; max-height:100%">`;
            t.style.display = 'flex';
        }
    </script>
</body>
</html>
