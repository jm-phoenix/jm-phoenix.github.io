<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GuideOS — Visor de guías</title>
<meta name="description" content="Visor de guías técnicas GuideOS: procedimientos paso a paso para técnicos." />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="./guide.css" />
</head>
<body>
<header class="app-header">
  <div style="display:flex;align-items:center;gap:12px">
    <button id="toggle-sidebar" aria-label="Menú">☰</button>
    <h1 id="guide-title">Cargando…</h1>
  </div>
  <div class="actions">
    <a href="./" class="btn-link">Guías</a>
    <select id="units-pref" aria-label="Unidades">
      <option value="auto">Auto</option>
      <option value="metric">Métricas</option>
      <option value="imperial">Imperiales</option>
    </select>
    <button id="toggle-theme" aria-label="Cambiar tema">🌓</button>
  </div>
</header>
<div id="error-banner" class="error hidden" role="alert"></div>
<div class="viewer-layout">
  <aside class="sidebar" id="sidebar" aria-label="Navegación de la guía">
    <h2>Fases</h2>
    <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <p class="muted" id="progress-label">0% completado</p>
    <nav id="toc"></nav>
  </aside>
  <main class="viewer-main" id="step-view" aria-live="polite"></main>
</div>
<script type="module" src="./guide.js"></script>
</body>
</html>
