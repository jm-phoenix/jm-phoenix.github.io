<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PhotoBooth · Sara Sofía XV</title>
  <meta name="description" content="Cabina de fotos del quinceañero de Sara Sofía. Tómate tus fotos, guárdalas en el carrete e imprímelas en 4×6." />
  <meta name="theme-color" content="#465A43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PhotoBooth" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">

    <!-- Pantalla de inicio / atrayente -->
    <section id="screen-attract" class="screen active">
      <div class="attract-inner">
        <p class="monogram">XV</p>
        <h1 id="attract-title">Sara Sofía</h1>
        <p class="subtitle" id="attract-subtitle">Mis Quince Años · Abril 2027</p>
        <button id="btn-start" class="btn btn-primary btn-big">📸 Toma tus fotos</button>
        <p class="hint" id="attract-hint">Toca el botón y sonríe</p>
      </div>
    </section>

    <!-- Pantalla de cámara: un solo preview grande, solo el recorte -->
    <section id="screen-camera" class="screen">
      <div class="stage">
        <video id="video-main" class="booth-cam" playsinline muted autoplay disablepictureinpicture></video>
        <div id="countdown" class="countdown" hidden>3</div>
      </div>
      <p id="camera-status" class="camera-status">Mírense en la pantalla…</p>
    </section>

    <!-- Pantalla de resultado -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">¡Quedó brutal!</h2>
      <img id="result-img" alt="Tu foto del quinceañero" />
      <div class="actions">
        <button id="btn-save-print" class="btn btn-primary" disabled>Guardar e Imprimir</button>
        <button id="btn-save-only" class="btn" disabled>Solo guardar</button>
        <button id="btn-retake" class="btn btn-ghost" disabled>Volver a empezar</button>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
